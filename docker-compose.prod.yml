# Contoh deployment produksi: SATU service (aplikasi web + API + PostgreSQL di dalam image yang sama).
# Salin ke server, isi nilai pada bagian environment (atau lewat file .env), lalu:  docker compose up -d
# Ganti nama file menjadi docker-compose.yml bila ingin dipakai tanpa opsi -f.
name: sima
services:
  sima:
    image: ghcr.io/mistersupri/sima:latest # tetapkan versi, mis. :1.0.0, untuk deployment yang dapat diulang
    restart: unless-stopped
    init: true
    stop_grace_period: 60s
    ports:
      - '127.0.0.1:8080:8080' # hanya dari server sendiri; reverse proxy HTTPS yang membukanya ke luar (docs/DEPLOYMENT.md)
    environment:
      # --- wajib ---
      APP_URL: ${APP_URL:?APP_URL wajib diisi (mis. https://sima.contoh.go.id)}
      SESSION_SECRET: ${SESSION_SECRET:?SESSION_SECRET wajib diisi (min. 32 karakter acak)}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD wajib diisi}
      BOOTSTRAP_ADMIN_EMAIL: ${BOOTSTRAP_ADMIN_EMAIL:?BOOTSTRAP_ADMIN_EMAIL wajib diisi}
      BOOTSTRAP_ADMIN_PASSWORD: ${BOOTSTRAP_ADMIN_PASSWORD:?BOOTSTRAP_ADMIN_PASSWORD wajib diisi}
      # --- opsional ---
      ORG_CODE: ${ORG_CODE:-INSTANSI}
      ORG_NAME: ${ORG_NAME:-Nama Instansi}
      BOOTSTRAP_ADMIN_NAME: ${BOOTSTRAP_ADMIN_NAME:-Super Admin}
      POSTGRES_USER: ${POSTGRES_USER:-sima}
      POSTGRES_DB: ${POSTGRES_DB:-sima}
      SESSION_TTL_HOURS: ${SESSION_TTL_HOURS:-12}
      LOGIN_MAX_ATTEMPTS: ${LOGIN_MAX_ATTEMPTS:-5}
      LOGIN_LOCK_MINUTES: ${LOGIN_LOCK_MINUTES:-15}
      MAX_UPLOAD_MB: ${MAX_UPLOAD_MB:-10}
      BACKUP_INTERVAL_HOURS: ${BACKUP_INTERVAL_HOURS:-24} # 0 = matikan backup terjadwal
      KEEP_DAILY: ${KEEP_DAILY:-7}
      KEEP_WEEKLY: ${KEEP_WEEKLY:-4}
    volumes:
      - pgdata:/var/lib/postgresql/data # database
      - storage:/data/storage # foto dan lampiran privat
      - ./backups:/backups # hasil backup (salin ke penyimpanan lain secara berkala)

volumes:
  pgdata:
  storage:
