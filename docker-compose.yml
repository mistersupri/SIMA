# Development: `pnpm dev` menjalankan service `db` ini lalu API dan web di host.
# Layanan api/web untuk deployment ditambahkan pada tahap Docker deployment.
services:
  db:
    image: postgres:16-alpine
    container_name: sima-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-sima}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD wajib diisi di .env}
      POSTGRES_DB: ${POSTGRES_DB:-sima}
      TZ: Asia/Jakarta
    ports:
      - '${POSTGRES_PORT:-5432}:5432'
    volumes:
      - sima-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}']
      interval: 3s
      timeout: 3s
      retries: 20

volumes:
  sima-pgdata:
