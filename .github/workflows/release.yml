name: Release

# Rilis dipicu oleh tag versi (mis. v1.0.0): jalankan CI, publikasikan image ke GHCR, lalu deploy ke server.
# Redeploy/rollback ke tag yang sudah dipublikasikan: jalankan manual (workflow_dispatch) dengan tag tersebut.
on:
  push:
    tags: ['v[0-9]+.[0-9]+.[0-9]+']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag image yang di-deploy (mis. 1.0.0), tanpa publish ulang'
        required: true

permissions:
  contents: read

jobs:
  ci:
    if: github.event_name == 'push'
    uses: ./.github/workflows/ci.yml

  publish:
    name: Publikasikan image ke GHCR
    needs: ci
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    outputs:
      version: ${{ steps.ver.outputs.version }}
    strategy:
      matrix:
        image: [api, web]
    steps:
      - uses: actions/checkout@v4
      - id: ver
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/sima-${{ matrix.image }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest
          labels: |
            org.opencontainers.image.title=SIMA ${{ matrix.image }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/Dockerfile.${{ matrix.image }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,scope=${{ matrix.image }},mode=max

  deploy:
    name: Deploy ke server
    needs: [publish]
    # Jalan juga untuk workflow_dispatch (publish di-skip), tetapi tidak bila publish/ci gagal.
    if: ${{ !cancelled() && !failure() }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production # tambahkan "required reviewers" di Settings > Environments untuk persetujuan manual
    permissions:
      contents: read
      packages: read
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - name: Tentukan versi dan nama image
        id: v
        env:
          INPUT_TAG: ${{ github.event.inputs.tag }}
        run: |
          VERSION="${INPUT_TAG:-${GITHUB_REF_NAME#v}}"
          VERSION="${VERSION#v}"
          [[ "$VERSION" =~ ^[0-9A-Za-z][0-9A-Za-z._-]*$ ]] || { echo "Tag tidak valid: $VERSION" >&2; exit 1; }
          OWNER="${GITHUB_REPOSITORY_OWNER,,}"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "api=ghcr.io/$OWNER/sima-api:$VERSION" >> "$GITHUB_OUTPUT"
          echo "web=ghcr.io/$OWNER/sima-web:$VERSION" >> "$GITHUB_OUTPUT"
      - name: Siapkan SSH
        env:
          SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/deploy_key && chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
      - name: Kirim berkas compose dan skrip
        env:
          HOST: ${{ secrets.DEPLOY_HOST }}
          USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
        run: |
          SSH="ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=yes -p ${{ secrets.DEPLOY_PORT || 22 }}"
          tar czf - docker-compose.prod.yml deploy | $SSH "$USER@$HOST" "mkdir -p '$DEPLOY_PATH' && tar xzf - -C '$DEPLOY_PATH'"
      - name: Backup, tarik image, dan jalankan
        env:
          HOST: ${{ secrets.DEPLOY_HOST }}
          USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
          GHCR_USER: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          API_IMAGE: ${{ steps.v.outputs.api }}
          WEB_IMAGE: ${{ steps.v.outputs.web }}
        run: |
          SSH="ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=yes -p ${{ secrets.DEPLOY_PORT || 22 }}"
          # Token tidak ditaruh di argumen perintah (terlihat di daftar proses): dikirim ke file sementara
          # berizin 600 di server, dipakai untuk docker login, lalu dihapus saat skrip selesai.
          printf '%s' "$GHCR_TOKEN" | $SSH "$USER@$HOST" 'umask 077; cat > "$HOME/.sima_ghcr_token"'
          $SSH "$USER@$HOST" \
            "GHCR_USER='$GHCR_USER' API_IMAGE='$API_IMAGE' WEB_IMAGE='$WEB_IMAGE' DEPLOY_PATH='$DEPLOY_PATH' bash -s" <<'REMOTE'
          set -euo pipefail
          trap 'rm -f "$HOME/.sima_ghcr_token"' EXIT
          cd "$DEPLOY_PATH"
          [ -f .env ] || { echo ".env belum ada di $DEPLOY_PATH (salin dari .env.production.example)" >&2; exit 1; }
          docker login ghcr.io -u "$GHCR_USER" --password-stdin < "$HOME/.sima_ghcr_token"
          C="docker compose -f docker-compose.prod.yml"

          # Backup sebelum memperbarui; bila stack sudah berjalan dan backup gagal, deploy dibatalkan.
          if [ -n "$($C ps -q backup 2>/dev/null)" ]; then
            echo "[deploy] backup sebelum pembaruan"
            $C exec -T backup /scripts/backup.sh
          fi

          # Catat versi image di .env agar perintah compose manual berikutnya memakai versi yang sama.
          grep -v '^SIMA_\(API\|WEB\)_IMAGE=' .env > .env.next || true
          printf 'SIMA_API_IMAGE=%s\nSIMA_WEB_IMAGE=%s\n' "$API_IMAGE" "$WEB_IMAGE" >> .env.next
          mv .env.next .env

          $C pull api web
          $C up -d --no-build --remove-orphans

          echo "[deploy] menunggu api sehat"
          for i in $(seq 1 40); do
            state="$(docker inspect -f '{{.State.Health.Status}}' "$($C ps -q api)" 2>/dev/null || echo starting)"
            [ "$state" = healthy ] && { echo "[deploy] api sehat"; break; }
            if [ "$i" = 40 ]; then echo "[deploy] api tidak sehat setelah 200 detik" >&2; $C logs --tail 60 api >&2; exit 1; fi
            sleep 5
          done
          $C ps
          docker image prune -f >/dev/null
          REMOTE
