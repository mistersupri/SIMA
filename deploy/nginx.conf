# Menyajikan SPA statis. TLS dan routing /api ditangani Caddy (lihat Caddyfile).
# add_header tidak diwariskan ke location yang punya add_header sendiri, jadi setiap
# location meng-include snippet header keamanan yang sama.
server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;
  server_tokens off;

  location = /healthz { access_log off; return 200 "ok"; }

  # Shell PWA harus selalu segar agar pembaruan versi sampai ke pengguna.
  location = /index.html { include /etc/nginx/snippets/security-headers.conf; add_header Cache-Control "no-cache" always; }
  location = /sw.js { include /etc/nginx/snippets/security-headers.conf; add_header Cache-Control "no-cache" always; }
  location = /manifest.webmanifest { include /etc/nginx/snippets/security-headers.conf; add_header Cache-Control "no-cache" always; }
  # Aset ber-hash dapat di-cache lama.
  location /assets/ { include /etc/nginx/snippets/security-headers.conf; add_header Cache-Control "public, max-age=31536000, immutable" always; try_files $uri =404; }
  # Fallback SPA untuk rute klien.
  location / { include /etc/nginx/snippets/security-headers.conf; add_header Cache-Control "no-cache" always; try_files $uri /index.html; }
}
